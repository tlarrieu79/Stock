<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stocks – Cellule secourisme</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script src="config.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mut:#667085;--bd:#e2e5ea;--ac:#d92d20;--ok:#067647;--okb:#e7f6ee;--wa:#b54708;--wab:#fff4e0;--ko:#b42318;--kob:#fde8e6;--kos:#d92d20}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1e2126;--tx:#eef0f3;--mut:#9aa3af;--bd:#30343b;--ac:#f04438;--ok:#75e0a7;--okb:#12301f;--wa:#fec84b;--wab:#3a2a0a;--ko:#fda29b;--kob:#3b1613;--kos:#f04438}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:var(--tx)}
input,select{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;min-width:0;width:100%}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:-1px}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:11px 16px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.lnk{background:none;border:none;color:var(--mut);padding:8px;font-size:.9rem}
.hide{display:none!important}

/* Connexion */
#login{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--kob),var(--bg) 55%)}
.lc{width:100%;max-width:380px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:30px 24px;box-shadow:0 10px 30px rgba(0,0,0,.08);text-align:center}
.logo{width:68px;height:68px;margin:0 auto 14px;border-radius:20px;background:var(--ac);display:flex;align-items:center;justify-content:center;font-size:2rem}
.lc h1{margin:0 0 4px;font-size:1.35rem}
.lc .s{color:var(--mut);font-size:.9rem;margin-bottom:22px}
.lc label{display:block;text-align:left;font-size:.8rem;color:var(--mut);margin:12px 0 5px;font-weight:600}
.lc button.p{width:100%;margin-top:18px;padding:14px}
.err{color:var(--ko);font-size:.88rem;min-height:1.3em;margin-top:12px;text-align:left}

/* Application */
main{max-width:760px;margin:0 auto;padding:16px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.head h1{font-size:1.25rem;margin:0}
h2.sec{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:22px 0 10px}
.rup{background:var(--kob);border:1px solid var(--kos);border-radius:14px;padding:6px 14px 10px;margin-bottom:6px}
.rup h2{color:var(--ko);font-size:.95rem;margin:10px 0 6px}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--kos);cursor:pointer}
.rrow:first-of-type{border-top:none}
.rrow b{color:var(--ko)}.rrow small{color:var(--ko);opacity:.85}
.rrow .q{background:var(--kos);color:#fff;border-radius:999px;font-weight:700;padding:2px 12px}
.good{background:var(--okb);color:var(--ok);border-radius:14px;padding:12px 14px;font-weight:600}
.warn{background:var(--wab);border-radius:14px;padding:6px 14px 8px;margin-top:10px}
.warn h2{color:var(--wa);font-size:.9rem;margin:8px 0 4px}
.warn .rrow{border-color:rgba(181,71,8,.3)}.warn .rrow b,.warn .rrow small{color:var(--wa)}
.warn .rrow .q{background:var(--wa);color:var(--card)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px 14px;cursor:pointer;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.tile:active{transform:scale(.98)}
.tile.bad{border-color:var(--kos);border-width:2px}
.tile b{font-size:1.02rem;word-break:break-word}
.tile small{color:var(--mut)}
.bd{display:flex;gap:6px;flex-wrap:wrap}
.b{font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 9px}
.b.o{background:var(--kos);color:#fff}.b.w{background:var(--wab);color:var(--wa)}
.tile.add{border-style:dashed;align-items:center;justify-content:center;color:var(--mut);font-weight:600;text-align:center}
.sb{margin-top:16px}
.sr{display:flex;gap:8px;margin-top:16px}
.sr input{flex:1}.sr button{white-space:nowrap}
.back{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.ctop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.ctop h1{margin:0;font-size:1.3rem;word-break:break-word}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--ok);border-radius:12px;padding:14px;margin-bottom:8px;cursor:pointer}
.item.low{border-left-color:var(--wa)}.item.out{border-left-color:var(--kos);background:var(--kob)}
.item .nm{font-weight:600}
.item .th{color:var(--mut);font-size:.8rem}
.item.out .nm,.item.out .th{color:var(--ko)}
.item .qn{font-size:1.35rem;font-weight:700;min-width:46px;text-align:right}
.item.out .qn{color:var(--ko)}.item.low .qn{color:var(--wa)}
.sum{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-top:16px}
.sum b{font-size:1.3rem}
.tv{font-weight:700;font-size:.95rem}
.empty{text-align:center;color:var(--mut);padding:28px 0}

/* Fenêtre article */
dialog{border:1px solid var(--bd);border-radius:18px;background:var(--card);color:var(--tx);width:min(400px,92vw);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:0 0 2px;font-size:1.1rem;word-break:break-word}
dialog .cl{color:var(--mut);font-size:.85rem}
.qv{text-align:center;margin:14px 0 4px}
.qbig{font-size:2.6rem;font-weight:800;line-height:1.1}
.st{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 6px;padding:10px;border:1px dashed var(--bd);border-radius:14px}
.st button{width:40px;height:40px;padding:0;font-size:1.2rem;border-radius:10px;color:var(--mut)}
.st input{width:84px;height:40px;text-align:center;font-size:1.2rem;font-weight:700;padding:6px}
.fi{font-size:1.9rem;line-height:1}
.tile{position:relative}
.tile.bad .fi{filter:hue-rotate(150deg) saturate(2)}
.sl{text-align:center;font-size:.85rem;color:var(--mut);margin-bottom:6px}
details{margin-top:12px}
summary{color:var(--mut);cursor:pointer;font-size:.9rem;padding:6px 0}
dialog label{display:block;font-size:.8rem;color:var(--mut);margin:10px 0 4px;font-weight:600}
.act{display:flex;gap:8px;margin-top:18px}
.act .p{flex:1;padding:13px}
</style>
</head>
<body>

<div id="login" class="hide">
  <div class="lc">
    <div class="logo">🩹</div>
    <h1>Stocks secourisme</h1>
    <div class="s">Connecte-toi pour accéder au stock de l’équipe</div>
    <label for="em">Adresse e-mail</label>
    <input id="em" type="email" placeholder="prenom@exemple.fr" autocomplete="username">
    <label for="pw">Mot de passe</label>
    <input id="pw" type="password" placeholder="••••••••" autocomplete="current-password">
    <div class="err" id="lerr"></div>
    <button class="p" id="go">Se connecter</button>
  </div>
</div>

<main id="app" class="hide"></main>

<dialog id="dlg">
  <h2 id="dn"></h2><div class="cl" id="dc"></div>
  <div class="qv" id="qv"><div class="qbig" id="qbig">0</div><div class="sl">en stock</div><div class="sl" id="qtot" style="font-weight:600;color:var(--tx)"></div><button class="lnk" id="edq">Modifier la quantité</button></div>
  <div class="st hide" id="stp"><button id="m">−</button><input id="qt" type="number" min="0" inputmode="numeric"><button id="pl">+</button></div>
  <details id="more"><summary>Modifier le nom, la catégorie, le seuil</summary>
    <label>Nom</label><input id="n">
    <label>Catégorie</label><select id="c"></select>
    <label>Prix unitaire (€)</label><input id="pr" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0,00">
    <label>Seuil d’alerte (alerte si quantité ≤ seuil)</label><input id="th" type="number" min="0" inputmode="numeric">
  </details>
  <div class="act"><button id="del" class="lnk" style="color:var(--ko)">Supprimer</button><button id="cx">Annuler</button><button id="ok" class="p">Valider</button></div>
</dialog>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var cfg=window.CONFIG;
if(!cfg||cfg.SUPABASE_URL.indexOf('VOTRE-PROJET')>-1){document.body.innerHTML='<p style="text-align:center;padding:40px">Renseigne SUPABASE_URL et SUPABASE_ANON_KEY dans config.js.</p>';return}
var sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
var cats=[],items=[],editId=null,newCat=null,loaded=false,search='';

function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
function st(i){return i.qty<=0?'out':(i.qty<=i.threshold?'low':'ok')}
function find(id){return items.filter(function(i){return i.id===id})[0]}
function cat(id){return cats.filter(function(c){return c.id===id})[0]}
function cname(id){var c=cat(id);return c?c.name:'Sans catégorie'}
function plural(n,w){return n+' '+w+(n>1?'s':'')}
function fail(e){if(e){alert('Erreur : '+(e.message||e));return true}return false}
function view(){var m=location.hash.match(/^#c=(.+)$/);return m?m[1]:null}
function fm(n){n=Math.round((+n||0)*100)/100;var p=n.toFixed(2).split('.');return p[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ')+','+p[1]}
function val(i){return (+i.qty||0)*(+i.price||0)}
function sumOf(l){return l.reduce(function(a,i){return a+val(i)},0)}
function rank(i){return {out:0,low:1,ok:2}[st(i)]}

/* ---------- Connexion ---------- */
async function boot(){
  var r=await sb.auth.getSession();show(!!r.data.session);
  sb.auth.onAuthStateChange(function(_e,s){show(!!s)});
}
function show(on){
  $('login').classList.toggle('hide',on);$('app').classList.toggle('hide',!on);
  if(on&&!loaded){loaded=true;load();sb.channel('stock').on('postgres_changes',{event:'*',schema:'public'},load).subscribe()}
  if(!on)loaded=false;
}
$('go').onclick=async function(){
  $('lerr').textContent='';$('go').disabled=true;
  var r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  $('go').disabled=false;
  if(r.error){var m=r.error.message||'',h=m;
    if(/invalid login/i.test(m))h='E-mail ou mot de passe incorrect.';
    else if(/not confirmed/i.test(m))h='Compte non confirmé dans Supabase.';
    else if(/fetch|network|load failed/i.test(m))h='Impossible de joindre le serveur. Vérifie config.js.';
    $('lerr').textContent=h}
};
$('pw').onkeydown=function(e){if(e.key==='Enter')$('go').click()};

/* ---------- Données ---------- */
async function load(){
  var a=await sb.from('categories').select('*').order('name');
  var b=await sb.from('items').select('*').order('name');
  if(a.error||b.error){$('app').innerHTML='<p class="empty">Erreur de chargement : '+esc((a.error||b.error).message)+'</p>';return}
  cats=a.data;items=b.data;render();
}
window.addEventListener('hashchange',function(){window.scrollTo(0,0);render()});

/* ---------- Affichage ---------- */
function rrow(i,cls){return '<div class="rrow" data-item="'+i.id+'"><div><b>'+esc(i.name)+'</b><br><small>'+esc(cname(i.category_id))+'</small></div><span class="q">'+i.qty+'</span></div>'}

function render(){
  var v=view();
  $('app').innerHTML=v?catView(v):home();
}

function home(){
  var outs=items.filter(function(i){return st(i)==='out'});
  var lows=items.filter(function(i){return st(i)==='low'});
  var h='<div class="head"><h1>🩹 Stocks secourisme</h1><button class="lnk" data-a="out">Déconnexion</button></div>';
  if(search){
    var r=items.filter(function(i){return (i.name+' '+cname(i.category_id)).toLowerCase().indexOf(search.toLowerCase())>-1}).sort(function(a,b){return rank(a)-rank(b)});
    h+='<div class="sr" style="margin-top:0"><input id="s" type="search" placeholder="Rechercher un article" value="'+esc(search)+'"><button class="p" data-a="addi" data-id="">+ Article</button></div>';
    h+='<h2 class="sec">Résultats ('+r.length+')</h2>'+(r.length?r.map(itemRow).join(''):'<div class="empty">Aucun article trouvé.</div>');
    return h;
  }
  if(!items.length)h+='';
  else if(outs.length)h+='<div class="rup"><h2>🔴 En rupture ('+outs.length+')</h2>'+outs.map(rrow).join('')+'</div>';
  else h+='<div class="good">✅ Aucun article en rupture</div>';
  if(lows.length)h+='<div class="warn"><h2>🟠 Stock bas ('+lows.length+')</h2>'+lows.map(rrow).join('')+'</div>';
  h+='<div class="sr"><input id="s" type="search" placeholder="Rechercher un article"><button class="p" data-a="addi" data-id="">+ Article</button></div>';
  h+='<h2 class="sec">Dossiers</h2><div class="grid">';
  cats.forEach(function(c){h+=tile(c.id,c.name)});
  var orphan=items.filter(function(i){return !i.category_id});
  if(orphan.length)h+=tile('none','Sans catégorie');
  h+='<div class="tile add" data-a="addc">+ Nouveau<br>dossier</div></div>';
  h+='<div class="sum"><div>Valeur totale du stock<br><small style="color:var(--mut)">'+plural(items.length,'article')+' · '+plural(cats.length,'dossier')+'</small></div><b>'+fm(sumOf(items))+' €</b></div>';
  h+='<button class="p" style="width:100%;margin-top:10px;padding:14px" data-a="pdf">📄 Exporter l’inventaire (PDF)</button>';
  return h;
}
function tile(id,name){
  var its=items.filter(function(i){return (id==='none'?!i.category_id:i.category_id===id)});
  var o=its.filter(function(i){return st(i)==='out'}).length,l=its.filter(function(i){return st(i)==='low'}).length;
  return '<div class="tile'+(o?' bad':'')+'" data-cat="'+id+'"><span class="fi">📁</span><b>'+esc(name)+'</b><div><small>'+plural(its.length,'article')+'</small><div class="tv">'+fm(sumOf(its))+' €</div>'
    +(o||l?'<div class="bd" style="margin-top:6px">'+(o?'<span class="b o">'+o+' rupture'+(o>1?'s':'')+'</span>':'')+(l?'<span class="b w">'+l+' bas</span>':'')+'</div>':'')+'</div></div>';
}
function itemRow(i){
  var s=st(i);
  return '<div class="item '+s+'" data-item="'+i.id+'"><div><div class="nm">'+esc(i.name)+'</div><div class="th">'+esc(cname(i.category_id))+' · seuil '+i.threshold+(+i.price?' · '+fm(i.price)+' €/u':'')+'</div></div><div style="text-align:right"><div class="qn">'+i.qty+'</div>'+(+i.price?'<div class="th">'+fm(val(i))+' €</div>':'')+'</div></div>';
}
function catView(id){
  var real=id!=='none',c=real?cat(id):null;
  if(real&&!c){location.hash='';return home()}
  var its=items.filter(function(i){return id==='none'?!i.category_id:i.category_id===id}).sort(function(a,b){return rank(a)-rank(b)||a.name.localeCompare(b.name)});
  var h='<div class="back"><button class="lnk" data-a="back">‹ Dossiers</button></div>';
  h+='<div class="ctop"><h1>📂 '+esc(real?c.name:'Sans catégorie')+'</h1><button class="p" data-a="addi" data-id="'+(real?id:'')+'">+ Article</button></div>';
  h+=its.length?its.map(itemRow).join(''):'<div class="empty">Aucun article dans cette catégorie.</div>';
  h+='<div class="sum"><div>Total du dossier</div><b>'+fm(sumOf(its))+' €</b></div>';
  if(real)h+='<div style="margin-top:18px;text-align:center"><button class="lnk" data-a="rc" data-id="'+id+'">Renommer la catégorie</button><button class="lnk" style="color:var(--ko)" data-a="dc" data-id="'+id+'">Supprimer la catégorie</button></div>';
  return h;
}

/* ---------- Actions ---------- */
$('app').addEventListener('input',function(e){if(e.target.id==='s'){search=e.target.value;var p=e.target.selectionStart;render();var s=$('s');if(s){s.focus();s.setSelectionRange(p,p)}}});
$('app').addEventListener('click',async function(e){
  var t=e.target.closest('[data-item],[data-cat],[data-a]');if(!t)return;
  if(t.dataset.item){openDlg(t.dataset.item);return}
  if(t.dataset.cat){location.hash='#c='+t.dataset.cat;return}
  var a=t.dataset.a;
  if(a==='out'){sb.auth.signOut()}
  else if(a==='back'){location.hash=''}
  else if(a==='pdf'){exportPdf()}
  else if(a==='addc'){
    var n=prompt('Nom de la nouvelle catégorie (ex. Pansements, Médicaments, Matériel)');
    if(n&&n.trim()){fail((await sb.from('categories').insert({name:n.trim()})).error);load()}
  }
  else if(a==='addi'){openDlg(null,t.dataset.id||null)}
  else if(a==='rc'){var c=cat(t.dataset.id),n2=prompt('Nouveau nom de la catégorie',c.name);
    if(n2&&n2.trim()&&n2.trim()!==c.name){fail((await sb.from('categories').update({name:n2.trim()}).eq('id',c.id)).error);load()}}
  else if(a==='dc'){var c2=cat(t.dataset.id);
    if(confirm('Supprimer la catégorie « '+c2.name+' » ? Ses articles seront conservés dans « Sans catégorie ».')){
      fail((await sb.from('categories').delete().eq('id',c2.id)).error);location.hash='';load()}}
});

function openDlg(id,presel){
  editId=id||null;var it=id?find(id):null;
  $('c').innerHTML='<option value="">Sans catégorie</option>'+cats.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join('');
  $('dn').textContent=it?it.name:'Nouvel article';
  $('dc').textContent=it?cname(it.category_id):'';
  $('n').value=it?it.name:'';
  $('c').value=it?(it.category_id||''):(presel||'');
  $('qt').value=it?it.qty:0;$('th').value=it?it.threshold:5;
  $('pr').value=it&&+it.price?it.price:'';refreshQ();
  $('qv').classList.toggle('hide',!it);
  $('stp').classList.toggle('hide',!!it);
  $('del').style.display=it?'':'none';
  $('more').open=!it;
  $('edq').classList.remove('hide');
  $('dlg').showModal();
}
function qv(){return Math.max(0,Math.floor(+$('qt').value||0))}
$('edq').onclick=function(){$('stp').classList.remove('hide');$('edq').classList.add('hide')};
function pv(){return Math.max(0,Math.round((+String($('pr').value).replace(',','.')||0)*100)/100)}
function refreshQ(){$('qbig').textContent=qv();var p=pv();$('qtot').textContent=p?('× '+fm(p)+' € = '+fm(qv()*p)+' €'):''}
$('m').onclick=function(){$('qt').value=Math.max(0,qv()-1);refreshQ()};
$('pl').onclick=function(){$('qt').value=qv()+1;refreshQ()};
$('qt').oninput=refreshQ;$('pr').oninput=refreshQ;
$('cx').onclick=function(){$('dlg').close()};
$('ok').onclick=async function(){
  var n=$('n').value.trim();
  if(!n){$('more').open=true;$('n').focus();return}
  var row={name:n,category_id:$('c').value||null,qty:qv(),price:pv(),threshold:Math.max(0,Math.floor(+$('th').value||0)),updated_at:new Date().toISOString()};
  $('ok').disabled=true;
  var r=editId?await sb.from('items').update(row).eq('id',editId):await sb.from('items').insert(row);
  $('ok').disabled=false;
  if(!fail(r.error)){$('dlg').close();load()}
};
$('del').onclick=async function(){
  if(editId&&confirm('Supprimer cet article ?')){fail((await sb.from('items').delete().eq('id',editId)).error);$('dlg').close();load()}
};


function exportPdf(){
  if(!window.jspdf){alert('Bibliothèque PDF non chargée. Vérifie ta connexion et réessaie.');return}
  var doc=new window.jspdf.jsPDF({unit:'pt',format:'a4'});
  var d=new Date(),ds=d.toLocaleDateString('fr-FR'),iso=d.toISOString().slice(0,10);
  doc.setFontSize(18);doc.text('Inventaire - Cellule secourisme',40,50);
  doc.setFontSize(10);doc.setTextColor(100);doc.text('Édité le '+ds+' · '+items.length+' articles',40,68);doc.setTextColor(0);
  var groups=cats.map(function(c){return{name:c.name,its:items.filter(function(i){return i.category_id===c.id})}});
  var orph=items.filter(function(i){return !i.category_id});
  if(orph.length)groups.push({name:'Sans catégorie',its:orph});
  var y=84;
  groups.forEach(function(g){
    if(!g.its.length)return;
    var sorted=g.its.slice().sort(function(a,b){return a.name.localeCompare(b.name)});
    var qsum=sorted.reduce(function(a,i){return a+i.qty},0);
    doc.autoTable({startY:y,theme:'grid',
      head:[[{content:g.name,colSpan:4,styles:{halign:'left',fillColor:[217,45,32],textColor:255,fontSize:11}}],['Article','Quantité','Prix unitaire (EUR)','Total (EUR)']],
      body:sorted.map(function(i){return [i.name,String(i.qty),fm(i.price),fm(val(i))]}),
      foot:[['Total '+g.name,String(qsum),'',fm(sumOf(sorted))]],
      headStyles:{fillColor:[60,64,72]},footStyles:{fillColor:[235,237,240],textColor:0,fontStyle:'bold'},
      columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'}},
      styles:{fontSize:9,cellPadding:4},margin:{left:40,right:40},showFoot:'lastPage',
      didParseCell:function(h){if(h.section==='body'&&h.column.index===1&&h.cell.raw==='0'){h.cell.styles.textColor=[180,35,24];h.cell.styles.fontStyle='bold'}}});
    y=doc.lastAutoTable.finalY+18;
  });
  doc.autoTable({startY:y,theme:'grid',
    head:[[{content:'Récapitulatif par catégorie',colSpan:4,styles:{halign:'left',fillColor:[217,45,32],textColor:255,fontSize:11}}],['Catégorie','Articles','Quantité totale','Valeur (EUR)']],
    body:groups.map(function(g){return [g.name,String(g.its.length),String(g.its.reduce(function(a,i){return a+i.qty},0)),fm(sumOf(g.its))]}),
    foot:[['TOTAL GÉNÉRAL',String(items.length),String(items.reduce(function(a,i){return a+i.qty},0)),fm(sumOf(items))]],
    headStyles:{fillColor:[60,64,72]},footStyles:{fillColor:[217,45,32],textColor:255,fontStyle:'bold'},
    columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'}},
    styles:{fontSize:10,cellPadding:5},margin:{left:40,right:40},showFoot:'lastPage'});
  var n=doc.getNumberOfPages();
  for(var k=1;k<=n;k++){doc.setPage(k);doc.setFontSize(8);doc.setTextColor(120);doc.text('Page '+k+' / '+n,doc.internal.pageSize.getWidth()-40,doc.internal.pageSize.getHeight()-20,{align:'right'})}
  doc.save('inventaire-secourisme-'+iso+'.pdf');
}

boot();
})();
</script>
