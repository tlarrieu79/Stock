<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stocks – Cellule secourisme</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#667085;--bd:#e2e5ea;--ac:#d92d20;--ok:#067647;--okb:#e7f6ee;--wa:#b54708;--wab:#fff4e0;--ko:#b42318;--kob:#fde8e6}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1e2126;--tx:#eef0f3;--mut:#9aa3af;--bd:#30343b;--ac:#f04438;--ok:#75e0a7;--okb:#12301f;--wa:#fec84b;--wab:#3a2a0a;--ko:#fda29b;--kob:#3b1613}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:0}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
.sub{color:var(--mut);font-size:.85rem;margin-bottom:14px}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:14px;background:var(--okb);color:var(--ok);font-weight:600}
.banner.bad{background:var(--kob);color:var(--ko)}
.banner ul{margin:6px 0 0;padding-left:18px;font-weight:500}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
input,select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
input,select{min-width:0}
.bar input{flex:1 1 160px}
button{cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.cat{margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.cat h2{font-size:1rem;margin:0;flex:1}
.cat .n{color:var(--mut);font-weight:400;font-size:.85rem}
.lnk{background:none;border:none;color:var(--mut);padding:6px;text-decoration:underline;font-size:.85rem}
.item{background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--ok);border-radius:12px;padding:12px;margin-bottom:10px}
.item.low{border-left-color:var(--wa)}.item.out{border-left-color:var(--ko)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.nm{font-weight:600}
.tag{font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;background:var(--okb);color:var(--ok)}
.low .tag{background:var(--wab);color:var(--wa)}.out .tag{background:var(--kob);color:var(--ko)}
.row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:44px;height:44px;padding:0;font-size:1.3rem}
.qty input{width:70px;text-align:center;font-weight:700;height:44px}
.th{color:var(--mut);font-size:.82rem;margin-left:auto}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(420px,92vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
dialog input,dialog select{width:100%}
.act{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.empty,.msg{text-align:center;color:var(--mut);padding:30px 0}
#login{max-width:340px;margin:12vh auto;padding:0 16px}
#login input{width:100%;margin-bottom:10px}
.err{color:var(--ko);font-size:.9rem;min-height:1.2em}
.hide{display:none!important}
</style>
</head>
<body>

<!-- ====== CONFIGURATION : à remplacer par les valeurs de ton projet Supabase ====== -->
<script>
window.CONFIG = {
  SUPABASE_URL: "https://VOTRE-PROJET.supabase.co",
  SUPABASE_ANON_KEY: "VOTRE_CLE_ANON_PUBLIQUE"
};
</script>

<div id="login" class="hide">
  <h1>🩹 Stocks secourisme</h1>
  <p class="sub">Connexion réservée à l'équipe</p>
  <input id="em" type="email" placeholder="E-mail" autocomplete="username">
  <input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password">
  <div class="err" id="lerr"></div>
  <button class="p" id="go" style="width:100%">Se connecter</button>
</div>

<main id="app" class="hide">
  <div class="head"><h1>🩹 Stocks – Cellule secourisme</h1><button class="lnk" id="out">Déconnexion</button></div>
  <div class="sub" id="sub"></div>
  <div id="alerts"></div>
  <div class="bar">
    <input id="q" type="search" placeholder="Rechercher un article">
    <select id="f"><option value="">Tous</option><option value="alert">À réapprovisionner</option></select>
  </div>
  <div class="bar">
    <button class="p" id="addI">+ Article</button>
    <button id="addC">+ Catégorie</button>
  </div>
  <div id="list"></div>
</main>

<dialog id="dlg">
  <h2 id="dt" style="margin:0;font-size:1.1rem">Article</h2>
  <label>Nom</label><input id="n" placeholder="Ex. Compresses stériles">
  <label>Catégorie</label><select id="c"></select>
  <label>Quantité en stock</label><input id="qt" type="number" min="0" inputmode="numeric">
  <label>Seuil d'alerte (alerte si quantité ≤ seuil)</label><input id="th" type="number" min="0" inputmode="numeric">
  <div class="act"><button id="del" class="lnk" style="margin-right:auto;color:var(--ko)">Supprimer</button><button id="cx">Annuler</button><button id="ok" class="p">Enregistrer</button></div>
</dialog>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var cfg=window.CONFIG;
var sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
var cats=[],items=[],editId=null,loaded=false;

function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
function status(i){var q=+i.qty||0,t=+i.threshold||0;return q<=0?'out':(q<=t?'low':'ok')}
function lbl(s){return s==='out'?'Rupture':s==='low'?'Stock bas':'OK'}
function fail(e){if(e){alert('Erreur : '+(e.message||e));return true}return false}
function catName(id){var c=cats.filter(function(x){return x.id===id})[0];return c?c.name:'Sans catégorie'}

/* ---------- Auth ---------- */
async function boot(){
  if(cfg.SUPABASE_URL.indexOf('VOTRE-PROJET')>-1){document.body.innerHTML='<p class="msg">Configure SUPABASE_URL et SUPABASE_ANON_KEY dans index.html.</p>';return}
  var r=await sb.auth.getSession();
  show(!!r.data.session);
  sb.auth.onAuthStateChange(function(_e,s){show(!!s)});
}
function show(logged){
  $('login').classList.toggle('hide',logged);$('app').classList.toggle('hide',!logged);
  if(logged&&!loaded){loaded=true;load();
    sb.channel('stock').on('postgres_changes',{event:'*',schema:'public'},load).subscribe();}
  if(!logged)loaded=false;
}
$('go').onclick=async function(){
  $('lerr').textContent='';
  var r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  if(r.error)$('lerr').textContent='E-mail ou mot de passe incorrect.';
};
$('pw').onkeydown=function(e){if(e.key==='Enter')$('go').click()};
$('out').onclick=function(){sb.auth.signOut()};

/* ---------- Données ---------- */
async function load(){
  var a=await sb.from('categories').select('*').order('name');
  var b=await sb.from('items').select('*').order('name');
  if(a.error||b.error){$('sub').textContent='Erreur de chargement : '+((a.error||b.error).message);return}
  cats=a.data;items=b.data;render();
}

function render(){
  var q=$('q').value.trim().toLowerCase(),f=$('f').value;
  var low=items.filter(function(i){return status(i)!=='ok'}).sort(function(a,b){return status(b).localeCompare(status(a))});
  $('alerts').innerHTML=!items.length?'':low.length
    ?'<div class="banner bad">⚠️ '+low.length+' article'+(low.length>1?'s':'')+' à réapprovisionner<ul>'+low.map(function(i){return '<li>'+esc(i.name)+' ('+esc(catName(i.category_id))+') : '+i.qty+' / seuil '+i.threshold+'</li>'}).join('')+'</ul></div>'
    :'<div class="banner">✅ Tous les stocks sont au-dessus des seuils</div>';
  $('sub').textContent=items.length+' article'+(items.length>1?'s':'')+' · '+cats.length+' catégorie'+(cats.length>1?'s':'');

  var groups=cats.map(function(c){return{id:c.id,name:c.name,real:true}});
  groups.push({id:null,name:'Sans catégorie',real:false});
  var html='';
  groups.forEach(function(g){
    var all=items.filter(function(i){return i.category_id===g.id});
    var vis=all.filter(function(i){
      if(f==='alert'&&status(i)==='ok')return false;
      return !q||i.name.toLowerCase().indexOf(q)>-1;
    });
    if(!g.real&&!all.length)return;
    if((q||f)&&!vis.length)return;
    html+='<div class="cat"><h2>'+esc(g.name)+' <span class="n">('+all.length+')</span></h2>'
      +(g.real?'<button class="lnk" data-a="rc" data-id="'+g.id+'">Renommer</button><button class="lnk" data-a="dc" data-id="'+g.id+'">Supprimer</button>':'')+'</div>';
    if(!vis.length)html+='<div class="empty" style="padding:8px 0">Aucun article</div>';
    vis.forEach(function(i){
      var s=status(i);
      html+='<div class="item '+s+'" data-id="'+i.id+'"><div class="top"><div class="nm">'+esc(i.name)+'</div><span class="tag">'+lbl(s)+'</span></div>'
        +'<div class="row"><div class="qty"><button data-a="m">−</button><input type="number" min="0" value="'+i.qty+'" data-a="set"><button data-a="p">+</button></div>'
        +'<span class="th">Seuil : '+i.threshold+'</span><button class="lnk" data-a="e">Modifier</button></div></div>';
    });
  });
  $('list').innerHTML=html||'<div class="empty">Commence par créer une catégorie avec « + Catégorie ».</div>';
}

function find(id){return items.filter(function(i){return i.id===id})[0]}
async function setQty(id,v){
  v=Math.max(0,Math.floor(+v||0));
  var it=find(id);if(it)it.qty=v;render();
  fail((await sb.from('items').update({qty:v,updated_at:new Date().toISOString()}).eq('id',id)).error);
}

/* ---------- Actions ---------- */
$('list').addEventListener('click',async function(e){
  var b=e.target.closest('button');if(!b)return;var a=b.dataset.a;
  if(a==='rc'||a==='dc'){
    var c=cats.filter(function(x){return x.id===b.dataset.id})[0];
    if(a==='rc'){var n=prompt('Nouveau nom de la catégorie',c.name);
      if(n&&n.trim()&&n.trim()!==c.name){fail((await sb.from('categories').update({name:n.trim()}).eq('id',c.id)).error);load()}}
    else if(confirm('Supprimer la catégorie « '+c.name+' » ? Ses articles seront conservés dans « Sans catégorie ».')){
      fail((await sb.from('categories').delete().eq('id',c.id)).error);load()}
    return;
  }
  var card=b.closest('.item');if(!card)return;var id=card.dataset.id,it=find(id);
  if(a==='p')setQty(id,it.qty+1);else if(a==='m')setQty(id,it.qty-1);else if(a==='e')openDlg(id);
});
$('list').addEventListener('change',function(e){if(e.target.dataset.a==='set')setQty(e.target.closest('.item').dataset.id,e.target.value)});
$('q').oninput=render;$('f').onchange=render;

$('addC').onclick=async function(){
  var n=prompt('Nom de la nouvelle catégorie (ex. Pansements, Matériel, Médicaments)');
  if(!n||!n.trim())return;
  fail((await sb.from('categories').insert({name:n.trim()})).error);load();
};

function openDlg(id){
  editId=id||null;var it=id?find(id):null;
  $('c').innerHTML='<option value="">Sans catégorie</option>'+cats.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join('');
  $('dt').textContent=it?'Modifier l\'article':'Nouvel article';
  $('n').value=it?it.name:'';$('c').value=it&&it.category_id?it.category_id:'';
  $('qt').value=it?it.qty:0;$('th').value=it?it.threshold:5;
  $('del').style.display=it?'':'none';$('dlg').showModal();
}
$('addI').onclick=function(){openDlg()};
$('cx').onclick=function(){$('dlg').close()};
$('ok').onclick=async function(){
  var n=$('n').value.trim();if(!n){$('n').focus();return}
  var row={name:n,category_id:$('c').value||null,qty:Math.max(0,Math.floor(+$('qt').value||0)),threshold:Math.max(0,Math.floor(+$('th').value||0)),updated_at:new Date().toISOString()};
  var r=editId?await sb.from('items').update(row).eq('id',editId):await sb.from('items').insert(row);
  $('dlg').close();if(!fail(r.error))load();
};
$('del').onclick=async function(){
  if(editId&&confirm('Supprimer cet article ?')){fail((await sb.from('items').delete().eq('id',editId)).error);$('dlg').close();load()}
};

boot();
})();
</script>
</body>
</html>
